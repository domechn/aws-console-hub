<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>AWS Console Hub</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#31435a" />
      <stop offset="1" stop-color="#141b25" />
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffc95e" />
      <stop offset="0.5" stop-color="#ff9e0b" />
      <stop offset="1" stop-color="#f57c00" />
    </linearGradient>
  </defs>

  <!-- squircle body, transparent margin so macOS renders it like a native icon -->
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)" />

  <!-- Three stacked windows: parallel, isolated account sessions.
       Each front-most layer sits on a dark plate that reads as a gap, so the
       stack stays legible even at 16px. Solid, stepped shades beat opacity. -->
  <rect x="332" y="249" width="470" height="330" rx="56" fill="#8f5410" />

  <rect x="262" y="332" width="500" height="360" rx="71" fill="#141b25" />
  <rect x="277" y="347" width="470" height="330" rx="56" fill="#d4820e" />

  <rect x="207" y="430" width="500" height="360" rx="71" fill="#141b25" />
  <rect x="222" y="445" width="470" height="330" rx="56" fill="url(#front)" />

  <!-- front window chrome -->
  <circle cx="264" cy="493" r="16" fill="#16202c" opacity="0.45" />
  <circle cx="312" cy="493" r="16" fill="#16202c" opacity="0.45" />
  <circle cx="360" cy="493" r="16" fill="#16202c" opacity="0.45" />

  <!-- front window screen -->
  <rect x="260" y="535" width="394" height="202" rx="30" fill="#16202c" />
  <rect x="296" y="581" width="200" height="26" rx="13" fill="#ff9e0b" />
  <rect x="296" y="633" width="130" height="26" rx="13" fill="#ffc95e" opacity="0.34" />
</svg>
