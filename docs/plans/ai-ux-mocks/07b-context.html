<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>07b 输入框：@ 上下文</title>
<link rel="stylesheet" href="mock.css" />
</head>
<body>
<aside class="panel">
  <header class="hdr">
    <button class="conv-btn"><span class="t">东京区 EC2 巡检</span><span class="i xs i-down"></span></button>
    <span class="mode">只读</span>
    <button class="ib"><span class="i i-plus"></span></button><button class="ib"><span class="i i-more"></span></button><button class="ib"><span class="i i-x"></span></button>
  </header>
  <div class="thread bottom">
    <div class="md" style="color:var(--text-dim)"><p>……其余 3 台都低于 20%。</p></div>
  </div>
  <footer class="comp">
    <div class="pop" role="listbox" aria-label="添加上下文" style="left:10px;right:10px;bottom:calc(100% - 2px)">
      <div class="pop-h">当前页面</div>
      <button class="pop-i"><span class="i sm i-page"></span><span class="main"><span class="l1">EC2 实例 · web-2</span><span class="l2">已添加 · 每次提问发送地址、标题、region</span></span><span class="i sm i-check st-ok"></span></button>
      <div class="pop-h">最近访问的资源 · 演示-测试</div>
      <button class="pop-i sel"><span class="i sm i-box"></span><span class="main"><span class="l1">web-1</span><span class="l2">EC2 实例 · i-0a41c7d953 · ap-northeast-1</span></span><span class="r">2 分钟前</span></button>
      <button class="pop-i"><span class="i sm i-box"></span><span class="main"><span class="l1">orders-queue</span><span class="l2">SQS 队列 · ap-northeast-1</span></span><span class="r">昨天</span></button>
      <button class="pop-i"><span class="i sm i-box"></span><span class="main"><span class="l1">order-worker</span><span class="l2">Lambda 函数 · ap-northeast-1</span></span><span class="r">昨天</span></button>
      <div class="pop-h">账号</div>
      <button class="pop-i"><span class="i sm i-user"></span><span class="main"><span class="l1">演示-测试 · 111111111111</span><span class="l2">对话绑定这个账号，不能引用其他账号</span></span></button>
      <div class="pop-ft"><span>只发送名称和 ID，助手需要时自己查询</span></div>
    </div>
    <div class="box focus">
      <div class="chips">
        <span class="chip"><span class="i xs i-page"></span><span class="t">EC2 实例 · web-2</span><button class="x"><span class="i xs i-x"></span></button></span>
        <span class="chip"><span class="i xs i-box"></span><span class="t">web-1 · i-0a41c7d953</span><button class="x"><span class="i xs i-x"></span></button></span>
      </div>
      <div class="ta">为什么 web-2 的 CPU 比 <span class="mention">@web</span><span class="cur"></span></div>
      <div class="tools">
        <button class="ib sm" style="background:var(--bg-active);color:var(--text)"><span class="i sm i-at"></span></button>
        <button class="ib sm"><span class="i sm i-slash"></span></button>
        <button class="model"><span class="t">Bedrock · Claude Sonnet 5.5</span><span class="i xs i-down"></span></button>
        <span class="sp"></span>
        <button class="send"><span class="i sm i-send"></span></button>
      </div>
    </div>
  </footer>
</aside>
</body>
</html>
